name: sched-ext-fedora-probe
# Section 4 side thread (docs/OPERATOR-BRIEF.md). Third attempt at proving
# the sched_ext accept path: a privileged Fedora container on the free
# ubuntu-24.04 runner, using Fedora's own packaged scx binary
# (scx_c_schedulers, which ships scx_simple) against the runner's real
# kernel, instead of building from source (attempts 1-2, docs/options/15,
# stalled on libbpf/bpftool version skew). Measurement only. Not kept
# past this measurement: delete after recording the result in
# docs/options/15.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
      options: --privileged --pid=host
    steps:
      - name: Host and kernel identity
        run: |
          uname -a
          cat /etc/os-release || true

      - name: sched_ext state before
        run: |
          echo "--- /sys/kernel/sched_ext ---"
          ls -la /sys/kernel/sched_ext/ 2>&1 || echo "MISSING: /sys/kernel/sched_ext"
          echo "--- state file ---"
          cat /sys/kernel/sched_ext/state 2>&1 || echo "MISSING: state file"

      - name: Install scx_c_schedulers
        run: |
          dnf install -y scx_c_schedulers
          rpm -q scx_c_schedulers
          echo "--- files ---"
          rpm -ql scx_c_schedulers

      - name: Locate scx_simple
        run: |
          command -v scx_simple || { echo "scx_simple not on PATH"; exit 1; }
          scx_simple --help 2>&1 | head -30 || true

      - name: Run scx_simple and capture state while loaded
        continue-on-error: true
        run: |
          set -x
          scx_simple > /tmp/scx_simple.log 2>&1 &
          SCX_PID=$!
          sleep 3
          echo "--- state while (intended) running ---"
          cat /sys/kernel/sched_ext/state 2>&1 || echo "MISSING: state file"
          ls -la /sys/kernel/sched_ext/ 2>&1 || true
          echo "--- scx_simple log so far ---"
          cat /tmp/scx_simple.log || true
          if kill -0 "$SCX_PID" 2>/dev/null; then
            echo "--- still running, sending SIGINT ---"
            kill -INT "$SCX_PID" 2>&1 || true
            sleep 1
          else
            echo "--- scx_simple already exited ---"
          fi
          wait "$SCX_PID" 2>/dev/null
          echo "exit status: $?"
          echo "--- full scx_simple log ---"
          cat /tmp/scx_simple.log || true

      - name: sched_ext state after
        run: |
          cat /sys/kernel/sched_ext/state 2>&1 || echo "MISSING: state file"

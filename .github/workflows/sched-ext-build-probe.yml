name: sched_ext accept-path probe (one-off)

# One-off measurement for docs/options/15-per-house-scheduling.md's
# deferred accept-path. The previous probe (deleted after answering its
# own question) established that GitHub-hosted ubuntu-24.04 has a real
# sched_ext-capable kernel (a populated /sys/kernel/sched_ext, and
# sched_ext_ops present in the running kernel's own BTF), but no
# distro-packaged scx scheduler binary via apt. This probe closes that
# second gap by building scx_simple from source (sched-ext/scx upstream)
# and actually loading it. Not part of this repo's own test suite --
# meant to be deleted once it has answered the question either way.

on:
  push:
    paths:
      - '.github/workflows/sched-ext-build-probe.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Kernel identity
        run: |
          uname -a
          cat /etc/os-release

      - name: Re-confirm kernel-level sched_ext support (previous probe's finding)
        run: |
          set +e
          if [ -d /sys/kernel/sched_ext ]; then
            echo "/sys/kernel/sched_ext EXISTS:"
            ls -la /sys/kernel/sched_ext
          else
            echo "/sys/kernel/sched_ext MISSING -- stop, nothing to build against"
            exit 1
          fi
          if [ -r /sys/kernel/btf/vmlinux ] && grep -aq "sched_ext_ops" /sys/kernel/btf/vmlinux; then
            echo "sched_ext_ops present in vmlinux BTF"
          else
            echo "sched_ext_ops NOT found in vmlinux BTF -- stop"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang llvm lld libelf-dev libbpf-dev zlib1g-dev libzstd-dev \
            pkg-config meson ninja-build cmake m4 build-essential \
            libseccomp-dev libcap-dev linux-tools-common \
            linux-tools-generic
          # bpftool is a virtual package here (E: Package 'bpftool' has no
          # installation candidate) -- linux-tools-generic already
          # provides the real binary for the running kernel. Verify
          # rather than assume: iteration 1 asked apt for it by name and
          # apt named the providers instead of installing anything.
          which bpftool || (echo "bpftool still missing after install" && exit 1)
          clang --version
          meson --version

      - name: Clone sched-ext/scx-c-examples
        run: |
          set -e
          # Iteration 2 found that the C schedulers, including scx_simple,
          # were moved out of sched-ext/scx into this separate repo -- the
          # cloned scx repo's own README says so in as many words ("C
          # schedulers like scx_simple were previously included in this
          # repository but have since been moved to scx-c-examples"), and
          # scx no longer has a scheds/c directory at all. Verified before
          # writing this, not assumed: fetched scx-c-examples's own README
          # first, which names `make all` as the build command and
          # `build/scheds/c/scx_simple` as the output path.
          git clone --depth 1 https://github.com/sched-ext/scx-c-examples.git /tmp/scx
          cd /tmp/scx
          git submodule update --init --recursive --depth 1 || echo "no submodules, or submodule init failed non-fatally"
          echo "=== top-level listing ==="
          ls -la
          echo "=== scheds/c listing (if present) ==="
          ls -la scheds/c 2>&1 || true
          echo "=== top-level README (first 100 lines) ==="
          head -100 README.md 2>&1 || true

      - name: Diagnostic - Makefile / meson build files for the C scheduler
        run: |
          cd /tmp/scx
          echo "=== find any Makefile ==="
          find . -maxdepth 3 -iname "Makefile*" 2>&1 || true
          echo "=== find any meson.build ==="
          find . -maxdepth 3 -iname "meson.build" 2>&1 || true
          echo "=== find scx_simple source ==="
          find . -iname "*scx_simple*" 2>&1 || true

      - name: Attempt build via make (this repo's own documented path)
        id: make_build
        continue-on-error: true
        run: |
          set -e
          cd /tmp/scx
          make all

      - name: Attempt build via meson (fallback, if the repo carries one)
        id: meson_build
        if: steps.make_build.outcome != 'success'
        continue-on-error: true
        run: |
          set -e
          cd /tmp/scx
          if [ -f meson.build ]; then
            meson setup build -Dbuildtype=release
            meson compile -C build scx_simple
          else
            echo "no meson.build -- make was the only documented path, and it failed"
            exit 1
          fi

      - name: Locate the built scx_simple binary
        id: locate
        run: |
          set +e
          BIN=$(find /tmp/scx -type f -iname "scx_simple" -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "NO scx_simple BINARY FOUND ANYWHERE UNDER /tmp/scx"
            find /tmp/scx -iname "*scx_simple*" 2>&1
            echo "found=no" >> "$GITHUB_OUTPUT"
          else
            echo "found scx_simple at: $BIN"
            file "$BIN"
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scx_simple and capture state at three checkpoints
        if: steps.locate.outputs.found == 'yes'
        run: |
          set +e
          BIN="${{ steps.locate.outputs.bin }}"

          echo "=== CHECKPOINT 1: BEFORE ==="
          echo "state: $(cat /sys/kernel/sched_ext/state 2>&1)"
          if [ -f /sys/kernel/sched_ext/root/ops ]; then
            echo "root ops: $(cat /sys/kernel/sched_ext/root/ops 2>&1)"
          else
            echo "root ops file does not exist yet (expected pre-load)"
          fi

          sudo "$BIN" &
          SCX_PID=$!
          echo "launched scx_simple, pid=$SCX_PID"

          echo "=== CHECKPOINT 2: WHILE RUNNING (polling for 'enabled') ==="
          FOUND_ENABLED=no
          for i in $(seq 1 20); do
            STATE=$(cat /sys/kernel/sched_ext/state 2>&1)
            echo "poll $i: state=$STATE"
            if [ "$STATE" = "enabled" ]; then
              FOUND_ENABLED=yes
              break
            fi
            if ! kill -0 "$SCX_PID" 2>/dev/null; then
              echo "scx_simple process exited early, pid $SCX_PID gone"
              break
            fi
            sleep 0.5
          done
          if [ "$FOUND_ENABLED" = "yes" ]; then
            echo "RESULT: state reached 'enabled'"
          else
            echo "RESULT: timeout expired before state reached 'enabled' (or process exited first)"
          fi
          if [ -f /sys/kernel/sched_ext/root/ops ]; then
            echo "root ops while running: $(cat /sys/kernel/sched_ext/root/ops 2>&1)"
          fi
          ps -p "$SCX_PID" -o pid,cmd 2>&1

          echo "=== stopping scx_simple ==="
          sudo kill -INT "$SCX_PID" 2>&1
          wait "$SCX_PID" 2>&1
          sleep 1

          echo "=== CHECKPOINT 3: AFTER (stopped cleanly) ==="
          echo "state: $(cat /sys/kernel/sched_ext/state 2>&1)"
          if [ -f /sys/kernel/sched_ext/root/ops ]; then
            echo "root ops: $(cat /sys/kernel/sched_ext/root/ops 2>&1)"
          else
            echo "root ops file does not exist (expected post-unload)"
          fi

      - name: Conclusion
        run: |
          if [ "${{ steps.locate.outputs.found }}" = "yes" ]; then
            echo "CONCLUSION: scx_simple was built from source and run on this"
            echo "runner's real kernel. See the previous step's three checkpoints"
            echo "for what /sys/kernel/sched_ext/state actually showed."
          else
            echo "CONCLUSION: the build did not produce a scx_simple binary."
            echo "See the meson/make step logs above for the exact failure."
          fi
